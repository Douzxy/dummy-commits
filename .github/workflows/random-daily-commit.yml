name: Random Daily Dummy Commit

on:
  schedule:
    - cron: "0 10 * * *" # 17:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  random-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Create random commits
        run: |
          git config user.name "Douzxy"
          git config user.email "EMAIL_KAMU_YANG_SAMA_DENGAN_GITHUB"

          COUNT=$(( (RANDOM % 5) + 1 ))
          echo "Today will create $COUNT commits"

          for i in $(seq 1 $COUNT)
          do
            echo "Random update $i - $(date)" >> dummy.txt
            git add dummy.txt
            git commit -m "Random commit $i on $(date '+%Y-%m-%d %H:%M:%S')"
          done

          git push origin main
