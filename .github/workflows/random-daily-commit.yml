name: Human Like Daily Commit

on:
  schedule:
    - cron: "0 0 * * *" # jalan tiap hari (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  random-commit:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v3

      - name: Create human-like commits
        run: |
          git config user.name "Douzxy"
          git config user.email "edopriyatna.tech@gmail.com"

          DAY=$(date +%u)  # 1=Mon ... 7=Sun

          # 20% kemungkinan libur
          SKIP=$((RANDOM % 5))
          if [ "$SKIP" -eq 0 ]; then
            echo "Taking a day off 😎"
            exit 0
          fi

          # Weekday vs Weekend
          if [ "$DAY" -le 5 ]; then
            COUNT=$(( (RANDOM % 11) + 5 ))   # weekday 5–15 commit
          else
            COUNT=$(( RANDOM % 6 ))          # weekend 0–5 commit
          fi

          echo "Today will create $COUNT commits"

          for i in $(seq 1 $COUNT)
          do
            # delay random 5–30 menit supaya terlihat natural
            DELAY=$(( (RANDOM % 1500) + 300 ))
            sleep $DELAY

            echo "Update $i - $(date)" >> activity.log
            git add activity.log
            git commit -m "chore: update $(date '+%H:%M:%S')"
            git push origin main
          done
