name: Human Like Daily Commit

on:
  schedule:
    - cron: "0 10 * * *"   # 17:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  random-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Create realistic commits
        run: |
          git config user.name "Douzxy"
          git config user.email "EMAIL_KAMU_YANG_SAMA_DENGAN_GITHUB"

          DAY=$(date +%u)   # 1=Mon ... 7=Sun
          SKIP=$((RANDOM % 10))

          # 10% chance libur total
          if [ "$SKIP" -eq 0 ]; then
            echo "Taking a day off 😎"
            exit 0
          fi

          case $DAY in
            1|2|3|4)
              COUNT=$(( (RANDOM % 4) + 1 )) ;;   # 1–4
            5)
              COUNT=$(( (RANDOM % 3) + 1 )) ;;   # 1–3
            6)
              COUNT=$(( (RANDOM % 3) + 1 )) ;;   # 1–3
            7)
              COUNT=$(( RANDOM % 3 )) ;;         # 0–2
          esac

          echo "Today will create $COUNT commits"

          for i in $(seq 1 $COUNT)
          do
            echo "Update $i - $(date)" >> activity.log
            git add activity.log
            git commit -m "chore: update $(date '+%H:%M:%S')"
          done

          if [ "$COUNT" -gt 0 ]; then
            git push origin main
          fi